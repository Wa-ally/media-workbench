<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b3e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="爆款工作台">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <title>新媒体爆款工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ====== Top Bar ====== -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <span class="app-logo">⚡</span>
      <span class="app-title">爆款工作台</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="searchBtn" title="搜索">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
  </header>

  <!-- ====== Search Overlay ====== -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="搜索视频、直播、分类..." autocomplete="off">
      <button id="closeSearchBtn">取消</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- ====== Page Container ====== -->
  <main class="page-container" id="pageContainer">
    <!-- Pages rendered by JS -->
  </main>

  <!-- ====== Bottom Navigation ====== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" data-page="videos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M10 8l5 2.5L10 13z" fill="currentColor"/></svg>
      <span>爆款视频</span>
    </button>
    <button class="nav-item nav-add" data-page="add">
      <div class="add-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </button>
    <button class="nav-item" data-page="streams">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>爆款直播</span>
    </button>
    <button class="nav-item" data-page="studio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span>拆解仿写</span>
    </button>
  </nav>

  <!-- ====== Add Menu Overlay ====== -->
  <div class="add-menu-overlay" id="addMenuOverlay" aria-hidden="true">
    <div class="add-menu">
      <button class="add-menu-item" data-action="add-video">
        <span class="menu-icon">🎬</span>
        <span class="menu-label">添加爆款视频</span>
      </button>
      <button class="add-menu-item" data-action="add-stream">
        <span class="menu-icon">📡</span>
        <span class="menu-label">添加爆款直播</span>
      </button>
      <button class="add-menu-item" data-action="go-studio">
        <span class="menu-icon">✍️</span>
        <span class="menu-label">拆解仿写文案</span>
      </button>
    </div>
  </div>

  <!-- ====== Modal: Video Detail ====== -->
  <div class="modal-overlay" id="videoModal" aria-hidden="true">
    <div class="modal-content video-detail">
      <div class="modal-header">
        <h3 id="videoDetailTitle">视频详情</h3>
        <button class="icon-btn" data-close="videoModal">✕</button>
      </div>
      <div class="modal-body" id="videoDetailBody"></div>
    </div>
  </div>

  <!-- ====== Modal: Add Video Form ====== -->
  <div class="modal-overlay" id="addVideoModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="addVideoTitle">添加爆款视频</h3>
        <button class="icon-btn" data-close="addVideoModal">✕</button>
      </div>
      <div class="modal-body">
        <form id="videoForm">
          <div class="form-group">
            <label>视频标题</label>
            <input type="text" id="videoTitleInput" placeholder="输入爆款视频标题" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>平台</label>
              <select id="videoPlatformInput">
                <option value="douyin">抖音</option>
                <option value="kuaishou">快手</option>
                <option value="xhs">小红书</option>
                <option value="bilibili">B站</option>
                <option value="wechat">视频号</option>
                <option value="youtube">YouTube</option>
                <option value="tiktok">TikTok</option>
              </select>
            </div>
            <div class="form-group">
              <label>分类</label>
              <select id="videoCategoryInput"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>作者</label>
              <input type="text" id="videoAuthorInput" placeholder="作者昵称">
            </div>
            <div class="form-group">
              <label>时长(秒)</label>
              <input type="number" id="videoDurationInput" placeholder="60" min="1">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>播放量</label>
              <input type="number" id="videoViewsInput" placeholder="100000" min="0">
            </div>
            <div class="form-group">
              <label>点赞量</label>
              <input type="number" id="videoLikesInput" placeholder="10000" min="0">
            </div>
          </div>
          <div class="form-group">
            <label>视频链接</label>
            <input type="url" id="videoUrlInput" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>视频文案/脚本</label>
            <textarea id="videoScriptInput" rows="4" placeholder="粘贴视频的完整文案/脚本文本..."></textarea>
          </div>
          <div class="form-group">
            <label>标签（逗号分隔）</label>
            <input type="text" id="videoTagsInput" placeholder="AI, 副业, 教程">
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">保存</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ====== Modal: Add Stream Form ====== -->
  <div class="modal-overlay" id="addStreamModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3>添加爆款直播</h3>
        <button class="icon-btn" data-close="addStreamModal">✕</button>
      </div>
      <div class="modal-body">
        <form id="streamForm">
          <div class="form-group">
            <label>直播标题</label>
            <input type="text" id="streamTitleInput" placeholder="输入直播标题" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>平台</label>
              <select id="streamPlatformInput">
                <option value="douyin">抖音</option>
                <option value="kuaishou">快手</option>
                <option value="bilibili">B站</option>
                <option value="wechat">视频号</option>
              </select>
            </div>
            <div class="form-group">
              <label>分类</label>
              <select id="streamCategoryInput"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>主播</label>
              <input type="text" id="streamHostInput" placeholder="主播昵称">
            </div>
            <div class="form-group">
              <label>时长(分钟)</label>
              <input type="number" id="streamDurationInput" placeholder="180" min="1">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>峰值人数</label>
              <input type="number" id="streamPeakInput" placeholder="50000" min="0">
            </div>
            <div class="form-group">
              <label>GMV(元)</label>
              <input type="number" id="streamGmvInput" placeholder="100000" min="0">
            </div>
          </div>
          <div class="form-group">
            <label>亮点（每行一条）</label>
            <textarea id="streamHighlightsInput" rows="3" placeholder="开场5分钟在线破8万&#10;利润款转化率12%"></textarea>
          </div>
          <div class="form-group">
            <label>标签（逗号分隔）</label>
            <input type="text" id="streamTagsInput" placeholder="AI培训, 课程带货">
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">保存</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ====== Modal: Video Breakdown Studio ====== -->
  <div class="modal-overlay modal-fullscreen" id="studioModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3>视频拆解 & 文案仿写</h3>
        <button class="icon-btn" data-close="studioModal">✕</button>
      </div>
      <div class="modal-body" id="studioBody"></div>
    </div>
  </div>

  <!-- ====== Modal: Copy Result ====== -->
  <div class="modal-overlay" id="copyResultModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3>仿写结果</h3>
        <button class="icon-btn" data-close="copyResultModal">✕</button>
      </div>
      <div class="modal-body" id="copyResultBody"></div>
    </div>
  </div>

  <!-- ====== Toast ====== -->
  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/copywriting.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
